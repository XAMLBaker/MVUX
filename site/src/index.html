<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Luke.Mvux</title>
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <div class="shell">
    <main class="content" style="grid-column: 1 / -1; padding-top: 48px;">
      <section class="hero">
        <div class="panel hero-main">
          <div class="eyebrow">Luke.Mvux docs</div>
          <h1>Choose a language</h1>
          <p class="lead">The Korean docs are the default source, and English and Chinese versions are available below.</p>
          <div class="cta-row">
            <a class="button primary" href="ko/">한국어</a>
            <a class="button" href="en/">English</a>
            <a class="button" href="zh/">中文</a>
          </div>
        </div>

        <div class="panel hero-side">
          <div class="stat-grid">
            <div class="stat"><small>Default</small><strong>Korean</strong></div>
            <div class="stat"><small>Other languages</small><strong>English, 中文</strong></div>
            <div class="stat"><small>Scope</small><strong>WPF and Avalonia</strong></div>
            <div class="stat"><small>Project</small><strong>Uno MVUX-style docs</strong></div>
          </div>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
